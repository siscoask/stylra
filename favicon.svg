<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#080808"/>
  <!-- Top arc - structured/clean (the "before") -->
  <path d="M 62 22 C 62 22 38 18 30 30 C 22 42 36 50 50 50" 
        stroke="url(#g1)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Gap glow dot -->
  <circle cx="50" cy="50" r="3.5" fill="#8b5cf6" filter="url(#glow)" opacity="0.9"/>
  <!-- Bottom arc - stylized/fluid (the "after") -->
  <path d="M 50 50 C 64 50 78 58 70 70 C 62 82 38 78 38 78"
        stroke="url(#g1)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.75"/>
</svg>
